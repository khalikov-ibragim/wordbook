name: CI
on:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Copy my repository
        uses: actions/checkout@v4

      - name: lint frontend dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
      - name: lint backend dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: lint docker-compose.yaml
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: docker-compose.yaml
          config_data: "extends: relaxed"

      - name: lint hooks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -name "*.sh" -print0 | xargs -0 -I{} shellcheck {}
  basic:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Copy my repository
        uses: actions/checkout@v4

      - name: build container
        run: docker compose build

      - name: copy .env
        run: cp .env.example .env

      - name: run docker compose
        run: docker compose up -d

      - name: check the container
        run: docker compose ps -a

      - name: wait for backend
        run: |
          for i in $(seq 1 30); do
          if curl -f http://localhost/api/health; then
          echo "backend ready"
            exit 0
          fi
          echo "waiting... attempt $i"
          sleep 2
          done
          echo "backend did not start in time"
          exit 1

      - name: testing working my project
        run: sudo apt-get update && sudo apt-get install -y python3-requests
      - name: run test
        run: python3 backend/test_file.py > test_file.txt
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: test_file.txt

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: push my backend
        run: |
          docker push glimpl/wordbook-backend:latest
      - name: push my frontend
        run: |
          docker push glimpl/wordbook-frontend:latest
  deploy:
    runs-on: self-hosted
    needs: [basic]
    steps:
      - name: Run my repository
        uses: actions/checkout@v4

      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: pull my docker project
        run: docker compose pull
      - name: start containers
        run: docker compose up -d
