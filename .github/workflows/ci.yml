name: CI
on:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Copy my repository
        uses: actions/checkout@v4

      - name: lint frontend dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
      - name: lint backend dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: lint docker-compose.yaml
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: docker-compose.yaml
          config_data: "extends: relaxed"

      - name: lint hooks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -name "*.sh" -print0 | xargs -0 -I{} shellcheck {}
  basic:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Copy my repository
        uses: actions/checkout@v4

      - name: build container
        run: docker compose build

      - name: copy .env
        run: cp .env.example .env

      - name: run docker compose
        run: docker compose up -d

      - name: check the container
        run: docker compose ps -a



      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: push my backend
        run: |
          docker tag glimpl/wordbook-backend:latest glimpl/wordbook-backend:${GITHUB_SHA::7}
          docker push glimpl/wordbook-backend:${GITHUB_SHA::7}
          docker push glimpl/wordbook-backend:latest
      - name: push my frontend
        run: |
          docker tag glimpl/wordbook-frontend:latest glimpl/wordbook-frontend:${GITHUB_SHA::7}
          docker push glimpl/wordbook-frontend:${GITHUB_SHA::7}
          docker push glimpl/wordbook-frontend:latest
  deploy:
    runs-on: self-hosted
    needs: [basic]
    steps:
      - name: Run my repository
        uses: actions/checkout@v4

      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: pull my docker project
        run: docker compose pull
      - name: start containers
        run: docker compose up -d
