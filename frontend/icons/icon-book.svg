<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98C3D"/>
      <stop offset="100%" stop-color="#3F9E8F"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1A1330"/>

  <!-- левая и правая "страницы" книги, слегка развёрнутые -->
  <path d="M 256 148 C 200 128, 140 128, 112 148 L 112 380 C 140 360, 200 360, 256 380 Z"
        fill="url(#g2)"/>
  <path d="M 256 148 C 312 128, 372 128, 400 148 L 400 380 C 372 360, 312 360, 256 380 Z"
        fill="url(#g2)" opacity="0.85"/>

  <!-- корешок -->
  <rect x="250" y="140" width="12" height="244" fill="#1A1330"/>

  <!-- строки текста на левой странице -->
  <rect x="140" y="200" width="90" height="10" rx="5" fill="#1A1330" opacity="0.55"/>
  <rect x="140" y="224" width="70" height="10" rx="5" fill="#1A1330" opacity="0.4"/>

  <!-- строки текста на правой странице -->
  <rect x="282" y="200" width="90" height="10" rx="5" fill="#1A1330" opacity="0.55"/>
  <rect x="282" y="224" width="70" height="10" rx="5" fill="#1A1330" opacity="0.4"/>

  <!-- двунаправленная стрелка перевода над корешком -->
  <path d="M 210 292 L 302 292 M 226 278 L 210 292 L 226 306 M 286 278 L 302 292 L 286 306"
        stroke="#F2B872" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
