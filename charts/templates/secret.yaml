{{- $fullName := include "wordbook.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{$fullName}}-secrets
  labels:
    {{- include "wordbook.labels" . | nindent 4}}
type: Opaque
stringData:
  {{- with ((.Values.backend | default dict).auth) }}
  PORT: {{ .port | quote }}
  DB_HOST: {{ .dbHost | quote }}
  DB_PORT: {{ .dbPort | quote }} #quote добавляет "" что бы не сломался вывод из за спец символов
  DB_USER: {{ .dbUser | quote }}
  DB_PASSWORD: {{ .dbPassword | quote }}
  DB_NAME: {{ .dbName | quote }}
  DATABASE_URL: {{ .databaseUrl | quote }}
  LIBRETRANSLATE_API_KEY: {{ .libretranslateApiKey | quote }}
  ARGOS_PACKAGE_INDEX: {{ .argosPackageIndex | quote }}
  FRONTEND_ORIGIN: {{ .frontendOrigin | quote }}
  AUTO_IMPORT_DICTIONARY: {{ .autoImportDictionary | quote }}
  DICTIONARY_SOURCE_BASE_URL: {{ .dictionarySourceBaseUrl | quote }}
  DICTIONARY_SOURCE_FILES: {{ .dictionarySourceFiles | quote }}
  DEVICE_BUNDLE_LIMIT_PER_FILE: {{ .deviceBundleLimitPerFile | quote }}
  {{- end }}
  {{- with ((.Values.libretranslate | default dict).auth) }}
  LT_LOAD_ONLY: {{ .ltLoadOnly | quote }}
  {{- end }}
  {{- with (( .Values.bd | default dict).auth) }}
  POSTGRES_DB: {{ .postgresDb | quote }}
  POSTGRES_USER: {{ .postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .postgresPassword | quote }}
  {{- end }}
  {{- with ((.Values.pgadmin | default dict).auth) }}
  PGADMIN_DEFAULT_EMAIL: {{ .defaultEmail | quote }}
  PGADMIN_DEFAULT_PASSWORD: {{ .defaultPassword | quote }}
  {{- end }}