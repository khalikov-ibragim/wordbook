apiVersion: v1
kind: ConfigMap
metadata:
  name: {{include "wordbook.fullname" . }}-nginx-config
  labels:
    {{- include "wordbook.labels" . | nindent 4 }}
data:
  default.conf: |
    server{
        listen 80;
        server_name mywordbook.duckdns.org;
        root /usr/share/nginx/html;
        index index.html;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;}

        resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

        location / {
        try_files $uri $uri/ /index.html;}

            location /api {
        proxy_pass http://wordbook-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


    }