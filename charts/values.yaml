namespace: wordbook

deployments:
  - name: frontend
    replicas: 2
    image:
      repository: glimpl/wordbook-frontend
      tag: latest #После окончания переписания на k3s заменить на правильный тег
    imagePullPolicy: IfNotPresent
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    port: 80
    service:
      enabled: true
      type: NodePort
      port: 8080
      nodePort: 30099
    extraVolumeMounts:
      - name: nginx-config
        mountPath: /etc/nginx/conf.d/default.conf
        subPath: default.conf
    extraVolumes:
      - name: nginx-config
        configMap:
          name: wordbook-nginx-config
    resources:
      requests: {memory: "64Mi", cpu: "65m"}
      limits: {memory: "128Mi", cpu: "130m"}

  - name: backend
    replicas: 3
    image:
      repository: glimpl/wordbook-backend
      tag: latest
    imagePullPolicy: IfNotPresent
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 1
    readinessProbe: #Проверка готовности
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe: #Проверка жизни
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 5
    autoscaling: #ВОзможность
      enabled: true
      minReplicas: 2
      maxReplicas: 5
    port: 3000
    service:
      enabled: true
      type: ClusterIP
      port: 3000
      targetPort: 3000
    envFromSecret: true
    resources:
      requests: {memory: "128Mi", cpu: "125m"}
      limits: {memory: "256Mi", cpu: "250m"}

  - name: bd
    replicas: 1
    image:
      repository: postgres
      tag: 16-alpine
    port: 5432
    service:
      enabled: true
      type: ClusterIP
      port: 5432
      targetPort: 5432
    envFromSecret: true
    persistence:
      enabled: true
      size: 5Gi
      mountPath: /var/lib/postgresql/data
    resources:
      requests: {memory: "256Mi", cpu: "250m"}
      limits: {memory: "512Mi", cpu: "500m"}

  - name: pgadmin
    replicas: 1
    image:
      repository: dpage/pgadmin4
      tag: latest
    port: 80
    service:
      enabled: true
      type: NodePort
      port: 6789
      targetPort: 80
    envFromSecret: true
    resources:
      requests: {memory: "128Mi", cpu: "125m"}
      limits: {memory: "256Mi", cpu: "250m"}

  - name: cloudflare
    replicas: 1
    image:
      repository: cloudflare/cloudflared
      tag: latest
    args:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - --url
      - http://wordbook-frontend:8080
    resources:
      requests: {memory: "128Mi", cpu: "125m"}
      limits: {memory: "256Mi", cpu: "250m"}

  - name: libretranslate
    replicas: 1
    image:
      repository: libretranslate/libretranslate
      tag: latest
    port: 5000
    service:
      enabled: true
      type: NodePort
      port: 5000
      nodePort: 30090
    persistence:
      enabled: true
      size: 10Gi
      mountPath: /home/libretranslate/.local/share/argos-translate
    envFromSecret: true
    resources:
      requests: {memory: "512Mi", cpu: "250m"}
      limits: {memory: "2Gi", cpu: "1000m"}


